name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-model.txt
      - run: python train_model.py
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test_demo.cjs
      - name: Check enhanced browser behavior
        run: node test_enhanced.cjs
      - name: Reproduce case study
        run: python benchmark.py
      - name: Upload reproducible model evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-evidence-${{ matrix.python }}
          path: |
            artifacts/*.json
          retention-days: 30
  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-pytorch.txt
      - run: python pytorch_demand.py
      - name: Upload PyTorch demand evidence
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-demand-evidence
          path: |
            artifacts/pytorch-demand-results.json
            artifacts/pytorch-demand.pt
          retention-days: 30
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t consulting-demand-lab .
      - run: docker run -d --name consulting-demand-lab -p 8001:8001 consulting-demand-lab
      - run: sleep 3 && curl --fail http://127.0.0.1:8001/health
      - if: always()
        run: docker rm -f consulting-demand-lab || true
